[project]
name = "agentcore-cdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # CDK
    "aws-cdk.aws-bedrock-agentcore-alpha==2.238.0a0",
    "aws-cdk-lib==2.238.0",
    "constructs==10.4.5",
    "cdk-ecr-deployment==4.1.0",
    # Agent runtime
    "bedrock-agentcore==1.3.1",
    "strands-agents==1.26.0",
    "strands-agents-tools==0.2.20",
    "aws-opentelemetry-distro-genai-beta==0.1.6",
    # Observability
    "arize-phoenix-otel==0.14.0",
    "openinference-instrumentation-bedrock==0.1.32",
    "openinference-instrumentation>=0.1.38",
    # Shared
    "mcp[cli]==1.26.0",
    "boto3==1.42.52",
    "botocore==1.42.52",
    "httpx==0.28.1",
    "requests==2.32.5",
    "python-dotenv==1.1.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
