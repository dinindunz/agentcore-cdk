[pytest]
# Pytest configuration for AgentCore CDK project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorising tests
markers =
    infrastructure: Infrastructure tests that require deployed AWS stack (deselect with '-m "not infrastructure"')
    unit: Unit tests that don't require external dependencies

# Minimum Python version
minversion = 3.9

# Test output options
addopts =
    # Verbose output
    -ra
    # Show summary of all test outcomes
    --strict-markers
    # Strict marker usage
    --tb=short
    # Shorter traceback format

# Environment variables (requires pytest-env)
env =
    PYTHONPATH=src

# Test paths
testpaths =
    tests

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term

# Ignore warnings (optional)
filterwarnings =
    # Ignore specific warnings
    ignore::DeprecationWarning
    # ignore::PendingDeprecationWarning
